<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Details | BakeNest</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">♧ BakeNest</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="recipes.html">Recipes</a>
        <a href="add-recipe.html">Add Recipe</a>
        <a href="my-recipes.html">My Recipes</a>
        <a href="saved-recipes.html">Saved Recipes</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <a href="recipes.html" class="back">← Back to Recipes</a>

    <section class="details-top">
      <img id="recipeImage" src="" alt="Recipe image">

      <div>
        <h2 id="recipeTitle">Loading recipe...</h2>
        <p class="recipe-info" id="recipeInfo"></p>
        <p id="recipeDescription"></p>

        <button class="btn btn-light" type="button">♡ Save</button>
      </div>
    </section>

    <section class="details-bottom">
      <div class="panel">
        <h3>Ingredients</h3>
        <ul id="recipeIngredients"></ul>
      </div>

      <div class="panel">
        <h3>Steps</h3>
        <ol id="recipeSteps"></ol>
      </div>
    </section>
  </main>

  <footer>© 2026 BakeNest · Baking made simple</footer>

  <script src="recipe-details.js"></script>
</body>

</html>
